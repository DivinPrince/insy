<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insy Example - React + Vite</title>

    <!-- Insy Script (Development Only) -->
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: background 0.3s ease;
      }
      body::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(34, 197, 94, 0.12) 0%, transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.08) 0%, transparent 60%),
          radial-gradient(circle at 80% 20%, rgba(34, 197, 94, 0.1) 0%, transparent 35%),
          radial-gradient(circle at 20% 80%, rgba(34, 197, 94, 0.1) 0%, transparent 35%);
        background-size: 100% 100%;
        z-index: 0;
        transition: opacity 0.3s ease;
      }
      body::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(circle at 25% 25%, rgba(34, 197, 94, 0.04) 1px, transparent 1px),
          radial-gradient(circle at 75% 75%, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: 0;
      }
      body.dark-mode {
        background: #0f0f0f;
      }
      body.dark-mode::before {
        background-image:
          radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 40% 20%, rgba(34, 197, 94, 0.05) 0%, transparent 50%);
      }
      .dark-mode-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        background: white;
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }
      .dark-mode-toggle:hover {
        transform: scale(1.1);
      }
      body.dark-mode .dark-mode-toggle {
        background: #1f1f1f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .dark-mode-toggle svg {
        width: 24px;
        height: 24px;
      }
      .sun-icon {
        display: none;
      }
      .moon-icon {
        display: block;
      }
      body.dark-mode .sun-icon {
        display: block;
      }
      body.dark-mode .moon-icon {
        display: none;
      }
      .login-wrapper {
        display: flex;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        max-width: 1000px;
        width: 90%;
        min-height: 600px;
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
      }
      body.dark-mode .login-wrapper {
        background: #1a1a1a;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        border: 1px solid #2a2a2a;
      }
      .image-side {
        flex: 1;
        background: #fafafa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 40px;
        position: relative;
        overflow: hidden;
      }
      .image-side::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.06) 0%, transparent 50%);
        z-index: 0;
      }
      .image-side::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 35px,
          rgba(34, 197, 94, 0.03) 35px,
          rgba(34, 197, 94, 0.03) 70px
        );
        z-index: 0;
      }
      .image-side .logo,
      .image-side h2 {
        position: relative;
        z-index: 1;
      }
      body.dark-mode .image-side {
        background: #161616;
      }
      body.dark-mode .image-side::before {
        background-image:
          radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.12) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.08) 0%, transparent 50%);
      }
      body.dark-mode .image-side::after {
        background-image: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 35px,
          rgba(34, 197, 94, 0.05) 35px,
          rgba(34, 197, 94, 0.05) 70px
        );
      }
      .progress-container {
        width: 100%;
        max-width: 320px;
      }
      .progress-header {
        margin-bottom: 32px;
      }
      .progress-header h2 {
        font-size: 18px;
        font-weight: 600;
        color: #171717;
        margin: 0 0 4px 0;
      }
      body.dark-mode .progress-header h2 {
        color: #f5f5f5;
      }
      .progress-header p {
        font-size: 13px;
        color: #737373;
        margin: 0;
      }
      body.dark-mode .progress-header p {
        color: #a3a3a3;
      }
      .progress-stats {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
      }
      .progress-label {
        font-size: 13px;
        color: #525252;
        font-weight: 500;
      }
      body.dark-mode .progress-label {
        color: #d4d4d4;
      }
      .progress-value {
        font-size: 24px;
        font-weight: 700;
        color: #171717;
      }
      body.dark-mode .progress-value {
        color: #f5f5f5;
      }
      .progress-bar-container {
        height: 8px;
        background: #e5e5e5;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 32px;
      }
      body.dark-mode .progress-bar-container {
        background: #262626;
      }
      .progress-bar-fill {
        height: 100%;
        background: #22c55e;
        border-radius: 4px;
        width: 36%;
        transition: width 1s ease;
      }
      body.dark-mode .progress-bar-fill {
        background: #22c55e;
      }
      .graph-section {
        margin-bottom: 32px;
      }
      .graph-title {
        font-size: 14px;
        font-weight: 600;
        color: #171717;
        margin-bottom: 16px;
      }
      body.dark-mode .graph-title {
        color: #f5f5f5;
      }
      .bar-item {
        margin-bottom: 16px;
      }
      .bar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .bar-label {
        font-size: 13px;
        color: #525252;
        font-weight: 500;
      }
      body.dark-mode .bar-label {
        color: #d4d4d4;
      }
      .bar-count {
        font-size: 15px;
        font-weight: 600;
        color: #171717;
      }
      body.dark-mode .bar-count {
        color: #f5f5f5;
      }
      .bar-track {
        height: 6px;
        background: #e5e5e5;
        border-radius: 3px;
        overflow: hidden;
      }
      body.dark-mode .bar-track {
        background: #262626;
      }
      .bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 1s ease;
      }
      .bar-fill.entered {
        background: #22c55e;
        width: 36%;
      }
      .bar-fill.remaining {
        background: #a3a3a3;
        width: 64%;
      }
      body.dark-mode .bar-fill.remaining {
        background: #525252;
      }
      .summary-card {
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 16px;
      }
      body.dark-mode .summary-card {
        background: #1c1c1c;
        border-color: #262626;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
      }
      .summary-row:not(:last-child) {
        border-bottom: 1px solid #f5f5f5;
      }
      body.dark-mode .summary-row:not(:last-child) {
        border-bottom: 1px solid #262626;
      }
      .summary-label {
        font-size: 13px;
        color: #737373;
      }
      body.dark-mode .summary-label {
        color: #a3a3a3;
      }
      .summary-value {
        font-size: 14px;
        font-weight: 600;
        color: #171717;
      }
      body.dark-mode .summary-value {
        color: #f5f5f5;
      }
      .login-container {
        flex: 1;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: all 0.3s ease;
      }
      .logo {
        width: 50px;
        height: 50px;
        margin: 0 0 24px 0;
        background: #22c55e;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg {
        width: 28px;
        height: 28px;
      }
      h1 {
        margin: 0 0 8px 0;
        color: #1a1a1a;
        font-size: 28px;
        font-weight: 700;
        transition: color 0.3s ease;
      }
      body.dark-mode h1 {
        color: #f5f5f5;
      }
      .subtitle {
        color: #666;
        margin: 0 0 32px 0;
        font-size: 15px;
        transition: color 0.3s ease;
      }
      body.dark-mode .subtitle {
        color: #888;
      }
      .form-group {
        margin-bottom: 20px;
        position: relative;
      }
      label {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        font-weight: 400;
        font-size: 15px;
        transition: all 0.2s ease;
        pointer-events: none;
        background: white;
        padding: 0 4px;
      }
      body.dark-mode label {
        background: #1a1a1a;
        color: #888;
      }
      label.active {
        top: 0;
        font-size: 12px;
        color: #22c55e;
        font-weight: 500;
      }
      body.dark-mode label.active {
        color: #22c55e;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        transition: all 0.2s;
        background: white;
        color: #1a1a1a;
      }
      body.dark-mode input {
        background: transparent;
        border-color: #2a2a2a;
        color: #f5f5f5;
      }
      input:focus {
        outline: none;
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
      }
      body.dark-mode input:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
      }
      button {
        width: 100%;
        padding: 13px;
        background: #22c55e;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
      }
      button:hover {
        background: #16a34a;
      }
      .forgot-password {
        text-align: center;
        margin-top: 20px;
      }
      .forgot-password a {
        color: #22c55e;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
      }
      .forgot-password a:hover {
        color: #16a34a;
      }
      @media (max-width: 768px) {
        .login-wrapper {
          flex-direction: column;
        }
        .image-side {
          padding: 40px;
          min-height: 300px;
        }
        .login-container {
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">
      <svg
        class="sun-icon"
        fill="none"
        stroke="#fbbf24"
        stroke-width="2"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg
        class="moon-icon"
        fill="none"
        stroke="#1a1a1a"
        stroke-width="2"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <div class="login-wrapper">
      <div class="image-side">
      </div>
      <div class="login-container">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"
              fill="white"
              stroke="white"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">Enter your credentials to continue</p>
        <form>
          <div class="form-group">
            <input type="email" id="email" name="email" required />
            <label for="email">Email</label>
          </div>
          <div class="form-group">
            <input type="password" id="password" name="password" required />
            <label for="password">Password</label>
          </div>
          <button type="submit">Login</button>
          <div class="forgot-password">
            <a href="#">Forgot password?</a>
          </div>
        </form>
      </div>
    </div>
    <script>
      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
      }

      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
      }

      document.querySelectorAll('.form-group input').forEach((input) => {
        const label = input.nextElementSibling;

        input.addEventListener('focus', () => {
          label.classList.add('active');
        });

        input.addEventListener('blur', () => {
          if (input.value === '') {
            label.classList.remove('active');
          }
        });

        if (input.value !== '') {
          label.classList.add('active');
        }
      });
    </script>
    <script src="http://localhost:7777/client.js"></script>
  </body>
</html>
