<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelCode Example - React + Vite</title>
    
    <!-- PixelCode Script (Development Only) -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: background 0.3s ease;
      }
      body::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
        background-size: 100% 100%;
        z-index: 0;
        transition: opacity 0.3s ease;
      }
      body::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
          repeating-linear-gradient(45deg, transparent, transparent 60px, rgba(59, 130, 246, 0.02) 60px, rgba(59, 130, 246, 0.02) 61px),
          repeating-linear-gradient(-45deg, transparent, transparent 60px, rgba(59, 130, 246, 0.02) 60px, rgba(59, 130, 246, 0.02) 61px);
        z-index: 0;
      }
      body.dark-mode {
        background: #0f0f0f;
      }
      body.dark-mode::before {
        background-image: 
          radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 40% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
      }
      .dark-mode-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        background: white;
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }
      .dark-mode-toggle:hover {
        transform: scale(1.1);
      }
      body.dark-mode .dark-mode-toggle {
        background: #1f1f1f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .dark-mode-toggle svg {
        width: 24px;
        height: 24px;
      }
      .sun-icon {
        display: none;
      }
      .moon-icon {
        display: block;
      }
      body.dark-mode .sun-icon {
        display: block;
      }
      body.dark-mode .moon-icon {
        display: none;
      }
      .login-wrapper {
        display: flex;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        max-width: 1000px;
        width: 90%;
        min-height: 600px;
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
      }
      body.dark-mode .login-wrapper {
        background: #1a1a1a;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        border: 1px solid #2a2a2a;
      }
      .image-side {
        flex: 1;
        background: #3b82f6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px;
        position: relative;
        overflow: hidden;
      }
      .image-side::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        background-image: 
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 30%),
          radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 30%),
          radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.08) 0%, transparent 25%);
        animation: float 20s ease-in-out infinite;
      }
      .image-side::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
          repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255, 255, 255, 0.03) 40px, rgba(255, 255, 255, 0.03) 41px),
          repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255, 255, 255, 0.03) 40px, rgba(255, 255, 255, 0.03) 41px);
      }
      @keyframes float {
        0%, 100% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(-50px, -50px) rotate(180deg);
        }
      }
      .image-content {
        text-align: center;
        color: white;
        position: relative;
        z-index: 1;
      }
      .image-content svg {
        width: 120px;
        height: 120px;
        margin-bottom: 30px;
      }
      .image-content h2 {
        font-size: 32px;
        margin: 0 0 16px 0;
        font-weight: 700;
      }
      .image-content p {
        font-size: 18px;
        opacity: 0.9;
        margin: 0;
      }
      .login-container {
        flex: 1;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: all 0.3s ease;
      }
      .logo {
        width: 50px;
        height: 50px;
        margin: 0 0 24px 0;
        background: #3b82f6;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg {
        width: 28px;
        height: 28px;
      }
      h1 {
        margin: 0 0 8px 0;
        color: #1a1a1a;
        font-size: 28px;
        font-weight: 700;
        transition: color 0.3s ease;
      }
      body.dark-mode h1 {
        color: #f5f5f5;
      }
      .subtitle {
        color: #666;
        margin: 0 0 32px 0;
        font-size: 15px;
        transition: color 0.3s ease;
      }
      body.dark-mode .subtitle {
        color: #888;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
        font-size: 14px;
        transition: color 0.3s ease;
      }
      body.dark-mode label {
        color: #c4c4c4;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        transition: all 0.2s;
        background: white;
        color: #1a1a1a;
      }
      body.dark-mode input {
        background: transparent;
        border-color: #2a2a2a;
        color: #f5f5f5;
      }
      body.dark-mode input::placeholder {
        color: #666;
      }
      input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }
      body.dark-mode input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      }
      button {
        width: 100%;
        padding: 13px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
      }
      button:hover {
        background: #2563eb;
      }
      .forgot-password {
        text-align: center;
        margin-top: 20px;
      }
      .forgot-password a {
        color: #3b82f6;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
      }
      .forgot-password a:hover {
        color: #2563eb;
      }
      @media (max-width: 768px) {
        .login-wrapper {
          flex-direction: column;
        }
        .image-side {
          padding: 40px;
          min-height: 200px;
        }
        .login-container {
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">
      <svg class="sun-icon" fill="none" stroke="#fbbf24" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" fill="none" stroke="#1a1a1a" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <div class="login-wrapper">
      <div class="image-side">
        <div class="image-content">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2>Welcome Back</h2>
          <p>Login to access your account</p>
        </div>
      </div>
      <div class="login-container">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Login</h1>
        <p class="subtitle">Enter your credentials to continue</p>
        <form>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>
          <button type="submit">Login</button>
          <div class="forgot-password">
            <a href="#">Forgot password?</a>
          </div>
        </form>
      </div>
    </div>
    <script>
      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
      }
      
      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
      }
    </script>
    <script src="http://localhost:7777/client.js"></script>
  </body>
</html>
